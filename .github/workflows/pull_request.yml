name: Run Unit Test

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install Xcode
        run: |
          sudo xcode-select --install || true

      - name: Install pods
        run: pod install --project-directory=Example

      - name: Run Unit Tests
        run: |
          xcodebuild test \
            -workspace Example/BreadPartnersSDK.xcworkspace \
            -scheme BreadPartnersSDK_Tests \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults.xcresult

      - name: Read coverage metrics
        id: coverage
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import subprocess
          import sys

          raw = subprocess.check_output(
              ["xcrun", "xccov", "view", "--report", "--json", "TestResults.xcresult"],
              text=True,
          ).strip()

          if not raw:
              raise SystemExit("xccov produced empty output")

          report = json.loads(raw)
          line_coverage = float(report.get("lineCoverage", 0.0)) * 100
          covered_lines = int(report.get("coveredLines", 0))
          executable_lines = int(report.get("executableLines", 0))
          targets = report.get("targets", [])

          print(f"percent={line_coverage:.2f}")
          print(f"covered_lines={covered_lines}")
          print(f"executable_lines={executable_lines}")
          print(f"target_count={len(targets)}")
          PY

      - name: Publish coverage summary in Checks
        run: |
          {
            echo "## Coverage"
            echo
            echo "| Metric | Value |"
            echo "| --- | ---: |"
            echo "| Line Coverage | **${{ steps.coverage.outputs.percent }}%** |"
            echo "| Covered Lines | ${{ steps.coverage.outputs.covered_lines }} |"
            echo "| Executable Lines | ${{ steps.coverage.outputs.executable_lines }} |"
            echo "| Targets in Report | ${{ steps.coverage.outputs.target_count }} |"
            echo
            echo "Source: \\`TestResults.xcresult\\`"
          } >> "$GITHUB_STEP_SUMMARY"
