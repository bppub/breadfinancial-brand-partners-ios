name: Run Unit Test

on:
  pull_request:
    branches:
      - master

concurrency:
  group: pr-${{ github.event.pull_request.number }}-unit-tests
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            Example/Pods
            ~/.cocoapods
            ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-pods-${{ hashFiles('Example/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Install pods
        run: pod install --project-directory=Example

      - name: Run Unit Tests
        run: |
          xcodebuild test \
            -workspace Example/BreadPartnersSDK.xcworkspace \
            -scheme BreadPartnersSDK_UnitTests \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -parallel-testing-enabled YES \
            -maximum-parallel-testing-workers 4 \
            -enableCodeCoverage YES \
            -resultBundlePath UnitTestResults.xcresult

      - name: Run UI Tests
        run: |
          xcodebuild test \
            -workspace Example/BreadPartnersSDK.xcworkspace \
            -scheme BreadPartnersSDK_UITests \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -enableCodeCoverage YES \
            -resultBundlePath UITestResults.xcresult

      - name: Publish combined coverage check run
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require("node:child_process");

            const readReport = (path) => {
              const raw = execSync(`xcrun xccov view --report --json ${path}`, { encoding: "utf8" }).trim();
              if (!raw) throw new Error(`xccov produced empty output for ${path}`);
              return JSON.parse(raw);
            };

            const unit = readReport("UnitTestResults.xcresult");
            const ui = readReport("UITestResults.xcresult");

            const unitCovered = Number(unit.coveredLines || 0);
            const unitExecutable = Number(unit.executableLines || 0);
            const uiCovered = Number(ui.coveredLines || 0);
            const uiExecutable = Number(ui.executableLines || 0);

            const covered = unitCovered + uiCovered;
            const executable = unitExecutable + uiExecutable;
            const percent = executable > 0 ? ((covered / executable) * 100).toFixed(2) : "0.00";

            const combinedTargetsByName = new Map();
            const allTargets = [
              ...(unit.targets || []),
              ...(ui.targets || [])
            ];

            for (const t of allTargets) {
              const name = String(t.name || "unknown");
              const coveredLines = Number(t.coveredLines || 0);
              const executableLines = Number(t.executableLines || 0);
              const prev = combinedTargetsByName.get(name) || { name, covered_lines: 0, executable_lines: 0 };
              prev.covered_lines += coveredLines;
              prev.executable_lines += executableLines;
              combinedTargetsByName.set(name, prev);
            }

            const targets = Array.from(combinedTargetsByName.values()).map(t => ({
              ...t,
              line_coverage: t.executable_lines > 0 ? (t.covered_lines / t.executable_lines) * 100 : 0
            }));
            targets.sort((a, b) => a.line_coverage - b.line_coverage);
            const targetCount = targets.length;

            const topLowCoverage = targets.slice(0, 8);
            const targetTable = topLowCoverage.length === 0
              ? "No target-level coverage details were returned."
              : [
                  "### Lowest Coverage Targets",
                  "| Target | Coverage | Covered / Executable |",
                  "| --- | ---: | ---: |",
                  ...topLowCoverage.map(t => `| ${t.name} | ${t.line_coverage.toFixed(2)}% | ${t.covered_lines} / ${t.executable_lines} |`)
                ].join("\n");

            const summary = `Line coverage: **${percent}%**`;
            const text = [
              "| Metric | Value |",
              "| --- | ---: |",
              `| Line Coverage | **${percent}%** |`,
              `| Covered Lines | ${covered} |`,
              `| Executable Lines | ${executable} |`,
              `| Targets in Report | ${targetCount} |`,
              "| Test Runs Combined | Unit + UI |",
              `| Workflow Run | ${context.runId} |`,
              `| Commit | ${context.sha.slice(0, 7)} |`,
              "",
              targetTable,
              "",
              "Source: `UnitTestResults.xcresult` + `UITestResults.xcresult`"
            ].join("\n");

            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: "Coverage (Combined)",
              head_sha: context.payload.pull_request.head.sha,
              status: "completed",
              conclusion: "success",
              output: {
                title: "Coverage",
                summary,
                text
              }
            });
