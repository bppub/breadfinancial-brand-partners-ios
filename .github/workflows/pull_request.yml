name: Run Unit Test

on:
  pull_request:
    branches:
      - master

concurrency:
  group: pr-${{ github.event.pull_request.number }}-unit-tests
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  unit_tests:
    runs-on: macos-latest
    outputs:
      percent: ${{ steps.coverage.outputs.percent }}
      covered_lines: ${{ steps.coverage.outputs.covered_lines }}
      executable_lines: ${{ steps.coverage.outputs.executable_lines }}
      target_count: ${{ steps.coverage.outputs.target_count }}
      targets_json: ${{ steps.coverage.outputs.targets_json }}
    steps:
      - uses: actions/checkout@v3

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            Example/Pods
            ~/.cocoapods
            ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-pods-${{ hashFiles('Example/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Install pods
        run: pod install --project-directory=Example

      - name: Run Unit Tests
        run: |
          xcodebuild test \
            -workspace Example/BreadPartnersSDK.xcworkspace \
            -scheme BreadPartnersSDK_UnitTests \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -parallel-testing-enabled YES \
            -maximum-parallel-testing-workers 4 \
            -enableCodeCoverage YES \
            -resultBundlePath UnitTestResults.xcresult
            -quiet
            


      - name: Read unit coverage metrics
        id: coverage
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import subprocess

          raw = subprocess.check_output(
              ["xcrun", "xccov", "view", "--report", "--json", "UnitTestResults.xcresult"],
              text=True,
          ).strip()

          if not raw:
              raise SystemExit("xccov produced empty output")

          report = json.loads(raw)
          line_coverage = float(report.get("lineCoverage", 0.0)) * 100
          covered_lines = int(report.get("coveredLines", 0))
          executable_lines = int(report.get("executableLines", 0))
          targets = report.get("targets", [])

          target_rows = []
          for t in targets:
              target_rows.append({
                  "name": str(t.get("name", "unknown")),
                  "line_coverage": round(float(t.get("lineCoverage", 0.0)) * 100, 2),
                  "covered_lines": int(t.get("coveredLines", 0)),
                  "executable_lines": int(t.get("executableLines", 0)),
              })

          target_rows.sort(key=lambda x: x["line_coverage"])

          print(f"percent={line_coverage:.2f}")
          print(f"covered_lines={covered_lines}")
          print(f"executable_lines={executable_lines}")
          print(f"target_count={len(targets)}")
          print(f"targets_json={json.dumps(target_rows, separators=(',', ':'))}")
          PY

  ui_tests:
    runs-on: macos-latest
    needs: unit_tests
    outputs:
      percent: ${{ steps.coverage.outputs.percent }}
      covered_lines: ${{ steps.coverage.outputs.covered_lines }}
      executable_lines: ${{ steps.coverage.outputs.executable_lines }}
      target_count: ${{ steps.coverage.outputs.target_count }}
      targets_json: ${{ steps.coverage.outputs.targets_json }}
    steps:
      - uses: actions/checkout@v3

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            Example/Pods
            ~/.cocoapods
            ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-pods-${{ hashFiles('Example/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Install pods
        run: pod install --project-directory=Example

      - name: Run UI Tests
        run: |
          xcodebuild test \
            -workspace Example/BreadPartnersSDK.xcworkspace \
            -scheme BreadPartnersSDK-UITests \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -enableCodeCoverage YES \
            -resultBundlePath UITestResults.xcresult
            -quite

      - name: Read UI coverage metrics
        id: coverage
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import subprocess

          raw = subprocess.check_output(
              ["xcrun", "xccov", "view", "--report", "--json", "UITestResults.xcresult"],
              text=True,
          ).strip()

          if not raw:
              raise SystemExit("xccov produced empty output")

          report = json.loads(raw)
          line_coverage = float(report.get("lineCoverage", 0.0)) * 100
          covered_lines = int(report.get("coveredLines", 0))
          executable_lines = int(report.get("executableLines", 0))
          targets = report.get("targets", [])

          target_rows = []
          for t in targets:
              target_rows.append({
                  "name": str(t.get("name", "unknown")),
                  "line_coverage": round(float(t.get("lineCoverage", 0.0)) * 100, 2),
                  "covered_lines": int(t.get("coveredLines", 0)),
                  "executable_lines": int(t.get("executableLines", 0)),
              })

          target_rows.sort(key=lambda x: x["line_coverage"])

          print(f"percent={line_coverage:.2f}")
          print(f"covered_lines={covered_lines}")
          print(f"executable_lines={executable_lines}")
          print(f"target_count={len(targets)}")
          print(f"targets_json={json.dumps(target_rows, separators=(',', ':'))}")
          PY

  combined_coverage:
    runs-on: macos-latest
    needs:
      - unit_tests
      - ui_tests
    steps:
      - name: Publish combined coverage check run
        uses: actions/github-script@v7
        env:
          UNIT_COVERED_LINES: ${{ needs.unit_tests.outputs.covered_lines }}
          UNIT_EXECUTABLE_LINES: ${{ needs.unit_tests.outputs.executable_lines }}
          UNIT_TARGETS_JSON: ${{ needs.unit_tests.outputs.targets_json }}
          UI_COVERED_LINES: ${{ needs.ui_tests.outputs.covered_lines }}
          UI_EXECUTABLE_LINES: ${{ needs.ui_tests.outputs.executable_lines }}
          UI_TARGETS_JSON: ${{ needs.ui_tests.outputs.targets_json }}
        with:
          script: |
            const unitCovered = Number(process.env.UNIT_COVERED_LINES || 0);
            const unitExecutable = Number(process.env.UNIT_EXECUTABLE_LINES || 0);
            const uiCovered = Number(process.env.UI_COVERED_LINES || 0);
            const uiExecutable = Number(process.env.UI_EXECUTABLE_LINES || 0);

            const covered = unitCovered + uiCovered;
            const executable = unitExecutable + uiExecutable;
            const percent = executable > 0 ? ((covered / executable) * 100).toFixed(2) : "0.00";

            const combinedTargetsByName = new Map();
            const allTargets = [
              ...JSON.parse(process.env.UNIT_TARGETS_JSON || "[]"),
              ...JSON.parse(process.env.UI_TARGETS_JSON || "[]")
            ];

            for (const t of allTargets) {
              const name = String(t.name || "unknown");
              const coveredLines = Number(t.covered_lines || 0);
              const executableLines = Number(t.executable_lines || 0);
              const prev = combinedTargetsByName.get(name) || { name, covered_lines: 0, executable_lines: 0 };
              prev.covered_lines += coveredLines;
              prev.executable_lines += executableLines;
              combinedTargetsByName.set(name, prev);
            }

            const targets = Array.from(combinedTargetsByName.values()).map(t => ({
              ...t,
              line_coverage: t.executable_lines > 0 ? (t.covered_lines / t.executable_lines) * 100 : 0
            }));
            targets.sort((a, b) => a.line_coverage - b.line_coverage);
            const targetCount = targets.length;

            const topLowCoverage = targets.slice(0, 8);
            const targetTable = topLowCoverage.length === 0
              ? "No target-level coverage details were returned."
              : [
                  "### Lowest Coverage Targets",
                  "| Target | Coverage | Covered / Executable |",
                  "| --- | ---: | ---: |",
                  ...topLowCoverage.map(t => `| ${t.name} | ${t.line_coverage.toFixed(2)}% | ${t.covered_lines} / ${t.executable_lines} |`)
                ].join("\n");

            const summary = `Line coverage: **${percent}%**`;
            const text = [
              "| Metric | Value |",
              "| --- | ---: |",
              `| Line Coverage | **${percent}%** |`,
              `| Covered Lines | ${covered} |`,
              `| Executable Lines | ${executable} |`,
              `| Targets in Report | ${targetCount} |`,
              "| Test Runs Combined | Unit + UI |",
              `| Workflow Run | ${context.runId} |`,
              `| Commit | ${context.sha.slice(0, 7)} |`,
              "",
              targetTable,
              "",
              "Source: `UnitTestResults.xcresult` + `UITestResults.xcresult`"
            ].join("\n");

            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: "Coverage (Combined)",
              head_sha: context.payload.pull_request.head.sha,
              status: "completed",
              conclusion: "success",
              output: {
                title: "Coverage",
                summary,
                text
              }
            });
